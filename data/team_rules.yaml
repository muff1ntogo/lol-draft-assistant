# Whole-comp rules (feature) and cross-team rules (ours x theirs), docs/synergy-v2.md, Stage 2b.
# Features are 0-1: {max: t}, {mean: t}, {sum: t, cap: c}, {lack: t, need: c}, {excess: t, over: x, cap: c},
# {protect: t, by: [..]},
# {max_any: [t, t]} (the comp's strongest on any), {none: [t, t]} (1 - max_any), {all: [f, f]} (product), {special: damage_imbalance | curve_coherence | identity_coherence}.
# prior_pp is the effect of the feature going 0 -> 1; the logistic fit on crawled matches moves it (ridge,
# prior SD 1pp). Drafted by Claude; priors are edited on the Rules page.

# ---------- our comp ----------
- id: has_fight_starter
  feature: {max_any: [engage, setup]}
  prior_pp: +1.5
  note: "Someone to start the fight"
- id: layered_engage
  feature: {sum: engage, cap: 2.0}
  prior_pp: +0.5
  note: "Several engage tools"
- id: frontline_amount
  feature: {sum: frontline_all, cap: 3.0}
  prior_pp: +1.0
  note: "Enough frontline"
- id: no_frontline
  feature: {lack: frontline_all, need: 2.0}
  prior_pp: -2.0
  note: "Nothing to stand in front"
- id: peel_for_carry
  feature: {protect: hypercarry, by: [enchanter, disengage]}
  prior_pp: +1.5
  note: "Peel for the hypercarry"
- id: cc_amount
  feature: {sum: cc_all, cap: 3.5}
  prior_pp: +0.8
  note: "Lots of crowd control"
- id: followup_without_setup
  feature: {all: [{sum: followup, cap: 2.0}, {none: [engage, setup]}]}
  prior_pp: -1.0
  note: "Fight enders with nobody to start the fight"
- id: needs_followup
  feature: {all: [{max: needs_team}, {max_any: [setup, dive]}]}
  prior_pp: +1.0
  note: "A team-dependent win condition with the team to play it"
- id: needs_team_alone
  feature: {all: [{max: needs_team}, {none: [setup, dive]}]}
  prior_pp: -1.0
  note: "A team-dependent win condition with no follow-up"
- id: has_disengage
  feature: {max: disengage}
  prior_pp: +0.5
  note: "A way out of bad fights"
- id: has_pick
  feature: {max: pick}
  prior_pp: +0.5
  note: "A catch tool"
- id: damage_imbalance
  feature: {special: damage_imbalance}
  prior_pp: -1.5
  note: "One damage type is easy to itemise against"
- id: curve_coherence
  feature: {special: curve_coherence}
  prior_pp: +0.5
  note: "Everyone peaks at the same time"
- id: identity_coherence
  feature: {special: identity_coherence}
  prior_pp: +1.0
  note: "The comp shares one plan"
- id: carries_compete
  feature: {excess: hypercarry, over: 1.2, cap: 1.0}
  prior_pp: -0.5
  note: "Too many carries for the gold"
- id: split_with_hold
  feature: {all: [{max: splitpush}, {max: disengage}]}
  prior_pp: +0.5
  note: "The four can hold while one splits"
- id: poke_without_engage
  feature: {sum: ability_range * not cc_all, cap: 2.0}
  prior_pp: +0.3
  note: "Long-range champions with no CC of their own"
# ---------- ours vs theirs ----------
- id: engage_vs_disengage
  ours: {max: engage}
  theirs: {max: disengage}
  prior_pp: -1.0
  note: "Their disengage blunts our engage"
- id: poke_vs_engage
  ours: {sum: poke, cap: 2.0}
  theirs: {max: engage}
  prior_pp: -1.0
  note: "Their hard engage runs down our poke"
- id: engage_vs_poke
  ours: {max: engage}
  theirs: {sum: poke, cap: 2.0}
  prior_pp: +0.8
  note: "Our engage punishes their poke"
- id: pick_vs_immobile_carry
  ours: {max: pick}
  theirs: {max: hypercarry * not dive}
  prior_pp: +0.8
  note: "Our catch tools find their immobile carry"
- id: dive_vs_peel
  ours: {max: dive}
  theirs: {max: peel_all}
  prior_pp: -0.6
  note: "Their peel stops our dive"
- id: dive_vs_immobile_carry
  ours: {max: dive}
  theirs: {max: hypercarry * not dive}
  prior_pp: +0.6
  note: "Our dive reaches their immobile carry"
- id: split_vs_engage
  ours: {max: splitpush}
  theirs: {max: engage}
  prior_pp: -0.5
  note: "Their engage forces 4v5 while we split"
