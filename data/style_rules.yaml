# Pair style rules for the core in-lane pairs (docs/synergy-v2.md, Stage 2a).
# A rule's strength for two champions = product of their trait intensities (0-1). prior_pp is the written
# effect at full strength; the fit to crawled pair data moves it (ridge, prior SD 1pp). Terms: tags (engage,
# disengage, poke, dive, pick, splitpush, enchanter, hypercarry), measured traits (cc, frontline, peel,
# lane_pressure, ranged, dmg_phys, dmg_magic, dmg_true), derived (ranged_long, power_curve_late,
# power_curve_early), `not X`, and products (`a * b`). Drafted by Claude; priors are edited on the Rules page.

# ---------- TOP-JG ----------
- pair: TOP-JG
  when: {TOP: power_curve_late, JG: power_curve_late}
  prior_pp: -1.0
  note: "Two scalers concede the early map on that side"
- pair: TOP-JG
  when: {TOP: power_curve_early, JG: power_curve_early}
  prior_pp: +0.8
  note: "Early duo snowballs top side"
- pair: TOP-JG
  when: {TOP: lane_pressure, JG: dive}
  prior_pp: +1.0
  note: "Top priority lets the jungler invade top side"
- pair: TOP-JG
  when: {TOP: not lane_pressure, JG: power_curve_late}
  prior_pp: -0.6
  note: "Weak-side top and a farming jungler give up top side"
- pair: TOP-JG
  when: {TOP: cc, JG: dive}
  prior_pp: +1.0
  note: "Top CC makes ganks land"
- pair: TOP-JG
  when: {TOP: engage, JG: engage}
  prior_pp: +0.8
  note: "Layered engage from top and jungle"
- pair: TOP-JG
  when: {TOP: dive, JG: dive}
  prior_pp: +0.8
  note: "Dive duo on top side"
- pair: TOP-JG
  when: {TOP: pick, JG: pick}
  prior_pp: +0.5
  note: "Catch duo on top side"
- pair: TOP-JG
  when: {TOP: hypercarry, JG: hypercarry}
  prior_pp: -0.8
  note: "Two carries starve each other"
- pair: TOP-JG
  when: {TOP: frontline, JG: hypercarry}
  prior_pp: +0.6
  note: "Tank top lets a carry jungler farm and fight"
- pair: TOP-JG
  when: {TOP: hypercarry, JG: cc}
  prior_pp: +0.6
  note: "CC jungler protects a scaling top with ganks"
- pair: TOP-JG
  when: {TOP: engage, JG: hypercarry}
  prior_pp: +0.6
  note: "Top engage opens fights for a carry jungler"
- pair: TOP-JG
  when: {TOP: frontline, JG: frontline}
  prior_pp: -0.4
  note: "Two tanks lack damage on top side"
- pair: TOP-JG
  when: {TOP: splitpush, JG: splitpush}
  prior_pp: -0.6
  note: "Two side-laners leave the team short in fights"
- pair: TOP-JG
  when: {TOP: poke, JG: dive}
  prior_pp: -0.5
  note: "Poke top can't follow a dive jungler"
