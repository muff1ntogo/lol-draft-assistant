[project]
name = "draftassist"
version = "0.2.0"
description = "Local pick/ban assistant for a Ranked 5s team (EUW)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "keyring>=25",
    "lcu-driver>=3.0.2",
    "numpy>=2.5.4",
    "pywebview>=6.2.1",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
    "zstandard>=0.23",
]

[project.scripts]
draftassist = "draftassist.launcher:main"

[project.gui-scripts]
draftassist-app = "draftassist.launcher:main"  # same launcher, no console window (output goes to cache/launcher.log)

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

# Releases are major.minor.<release run number - release_run_base> (.github/workflows/release.yml). When major.minor
# changes, set release_run_base to the last release's run number, so the new line starts at .1 (0.1.x ended at run 10).
[tool.draftassist]
release_run_base = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
]
