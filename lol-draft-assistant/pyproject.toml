[project]
name = "draftassist"
version = "0.1.0"
description = "Local pick/ban assistant for a Ranked 5s team (EUW)"
readme = "CLAUDE.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "lcu-driver>=3.0.2",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
